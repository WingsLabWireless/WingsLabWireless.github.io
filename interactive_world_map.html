<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Map – U.S.-Centered</title>
<style>
:root {
  --ocean:#f3f8fc;
  --land:#c9d5df;
  --us:#86aeca;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--ocean); font-family:Arial,Helvetica,sans-serif; }
#world-map {
  width:100%;
  aspect-ratio:16/8;
  min-height:300px;
  position:relative;
  overflow:hidden;
  background:var(--ocean);
}
#world-map svg { display:block; width:100%; height:100%; }
.region { stroke:#ffffff; stroke-width:.8; vector-effect:non-scaling-stroke; }
.country { fill:var(--land); }
.us-state { fill:var(--us); stroke:#f8fbff; stroke-width:1.05; }
/* State boundaries remain unchanged when a location is selected. */
.state-dot { stroke:#ffffff; stroke-width:1.8; pointer-events:all; }
.state-dot-halo { pointer-events:none; }
.us-outline {
  fill:none;
  stroke:#476f8f;
  stroke-width:2.2;
  vector-effect:non-scaling-stroke;
  pointer-events:none;
}
#map-legend {
  position:absolute; top:14px; right:16px;
  display:flex; gap:18px; padding:8px 12px;
  background:rgba(255,255,255,.86); border-radius:5px;
  font-size:13px; color:#324b61; pointer-events:none;
}
.legend-item { display:flex; align-items:center; gap:7px; }
.legend-dot { width:11px; height:11px; border-radius:50%; border:1px solid #fff; }
.message {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:#40576c;
  padding:20px;
  text-align:center;
}
</style>
</head>
<body>
<div id="world-map" role="img" aria-label="Single world map centered on the United States with yellow flashing testbed dots and green flashing user dots across selected U.S. states and countries">
  <div id="message" class="message">Loading map…</div>
  <div id="map-legend">
    <span class="legend-item"><span class="legend-dot" style="background:#ffff00"></span>Testbeds</span>
    <span class="legend-item"><span class="legend-dot" style="background:#00bf55"></span>Users</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
/* ========================= USER SETTINGS ========================= */
const testbedStates = ['MA', 'NY', 'VA', 'FL'];  // Yellow dots
const userStates = ['MA', 'NY', 'VA', 'FL', 'GA', 'OH']; // Green dots in U.S. states
const userCountries = ['Ireland', 'Spain', 'South Korea']; // Green dots outside U.S.
const flashSeconds = 5;
const usScaleX = 1.75;
const usScaleY = 1.45;
const dotRadius = 6;          // Dot radius in SVG pixels
const testbedDotColor = '#ffff00'; // Yellow: testbeds
const userDotColor = '#00bf55';    // Green: users
const dotOffset = 8;           // Separation when both markers share a state
const dotMinOpacity = 0.25;  // How faint the dots become during flashing
/* ================================================================ */

const stateAbbrevToName = {
  AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California', CO:'Colorado', CT:'Connecticut', DE:'Delaware', FL:'Florida',
  GA:'Georgia', HI:'Hawaii', ID:'Idaho', IL:'Illinois', IN:'Indiana', IA:'Iowa', KS:'Kansas', KY:'Kentucky', LA:'Louisiana',
  ME:'Maine', MD:'Maryland', MA:'Massachusetts', MI:'Michigan', MN:'Minnesota', MS:'Mississippi', MO:'Missouri', MT:'Montana',
  NE:'Nebraska', NV:'Nevada', NH:'New Hampshire', NJ:'New Jersey', NM:'New Mexico', NY:'New York', NC:'North Carolina', ND:'North Dakota',
  OH:'Ohio', OK:'Oklahoma', OR:'Oregon', PA:'Pennsylvania', RI:'Rhode Island', SC:'South Carolina', SD:'South Dakota', TN:'Tennessee',
  TX:'Texas', UT:'Utah', VT:'Vermont', VA:'Virginia', WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming', DC:'District of Columbia'
};

const normalize = s => String(s || '').trim().toLowerCase();
const normalizeStateInput = s => {
  const t = String(s || '').trim();
  const up = t.toUpperCase();
  return normalize(stateAbbrevToName[up] || t);
};

let testbedStatesSet = new Set(testbedStates.map(normalizeStateInput));
let userStatesSet = new Set(userStates.map(normalizeStateInput));
let userCountriesSet = new Set(userCountries.map(normalize));
let stateShapes = [];
let dotMarkers = [];
const usColor = '#86aeca';

function animateFlash(now) {
  const duration = Math.max(0.5, Number(flashSeconds) || 5) * 1000;
  const pulse = (1 - Math.cos(2 * Math.PI * (now % duration) / duration)) / 2;
  for (const marker of dotMarkers) {
    marker.dot.attr('opacity', dotMinOpacity + (1 - dotMinOpacity) * pulse);
    marker.halo.attr('opacity', 0.14 * pulse).attr('r', dotRadius + 3 + 3 * pulse);
  }
  requestAnimationFrame(animateFlash);
}
requestAnimationFrame(animateFlash);

function updateMap({states, testbeds, users, countries} = {}) {
  // 'states' is retained as an alias for the original yellow testbed dots.
  if (states !== undefined) testbedStatesSet = new Set(states.map(normalizeStateInput));
  if (testbeds !== undefined) testbedStatesSet = new Set(testbeds.map(normalizeStateInput));
  if (users !== undefined) userStatesSet = new Set(users.map(normalizeStateInput));
  if (countries !== undefined) userCountriesSet = new Set(countries.map(normalize));
  for (const marker of dotMarkers) {
    const activeSet = marker.isCountry ? userCountriesSet : (marker.type === 'testbed' ? testbedStatesSet : userStatesSet);
    const visible = activeSet.has(normalize(marker.name));
    marker.group.style('display', visible ? null : 'none');
  }
}
window.updateMap = updateMap;

Promise.all([
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json'),
  d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
]).then(([world, usa]) => {
  const W = 1200, H = 600;
  const svg = d3.select('#world-map').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('preserveAspectRatio', 'xMidYMid meet');

  const countries = topojson.feature(world, world.objects.countries).features;
  const states = topojson.feature(usa, usa.objects.states).features;
  const usCountry = countries.find(d => String(d.id) === '840' || normalize(d.properties?.name) === 'united states of america');
  const otherCountries = countries.filter(d => d !== usCountry);

  // Rotate the world so the continental U.S. sits at the center of the map.
  const projection = d3.geoNaturalEarth1()
    .rotate([98, 0])
    .fitExtent([[10, 10], [W - 10, H - 10]], { type: 'Sphere' });
  const path = d3.geoPath(projection);

  svg.append('g')
    .attr('class', 'world-layer')
    .selectAll('path.country')
    .data(otherCountries)
    .enter().append('path')
    .attr('class', 'region country')
    .attr('d', path)
    .append('title')
    .text(d => d.properties?.name || 'Country');

  const usBounds = path.bounds(usCountry);
  const cx = (usBounds[0][0] + usBounds[1][0]) / 2;
  const cy = (usBounds[0][1] + usBounds[1][1]) / 2;

  const usGroup = svg.append('g')
    .attr('class', 'us-group')
    .attr('transform', `translate(${cx},${cy}) scale(${usScaleX},${usScaleY}) translate(${-cx},${-cy})`);

  usGroup.append('path')
    .datum(usCountry)
    .attr('d', path)
    .attr('fill', usColor)
    .attr('stroke', 'none');

  usGroup.selectAll('path.state')
    .data(states)
    .enter().append('path')
    .attr('class', 'region us-state')
    .attr('d', path)
    .each(function(d) {
      stateShapes.push({ shape: d3.select(this), name: d.properties?.name, base: usColor });
    })
    .append('title')
    .text(d => d.properties?.name || 'U.S. state');

  usGroup.append('path')
    .datum(usCountry)
    .attr('class', 'us-outline')
    .attr('d', path);

  // Position circular markers after the U.S. stretching transform,
  // so each marker stays round rather than becoming an oval.
  const dotsLayer = svg.append('g').attr('class', 'state-dots-layer');
  function addMarker(name, x, y, type, color, isCountry = false) {
    const group = dotsLayer.append('g')
      .attr('transform', `translate(${x},${y})`);
    const halo = group.append('circle')
      .attr('class', 'state-dot-halo')
      .attr('fill', color)
      .attr('r', dotRadius + 3)
      .attr('opacity', 0);
    const dot = group.append('circle')
      .attr('class', 'state-dot')
      .attr('r', dotRadius)
      .attr('fill', color);
    dot.append('title').text(`${name} — ${type === 'testbed' ? 'Testbed' : 'User'}`);
    dotMarkers.push({name, type, isCountry, group, dot, halo});
  }
  states.forEach(state => {
    const name = state.properties?.name;
    const [px, py] = path.centroid(state);
    if (!Number.isFinite(px) || !Number.isFinite(py)) return;
    const x = cx + usScaleX * (px - cx);
    const y = cy + usScaleY * (py - cy);
    // Separate the yellow and green dots horizontally so neither obscures the other.
    addMarker(name, x - dotOffset, y, 'testbed', testbedDotColor);
    addMarker(name, x + dotOffset, y, 'user', userDotColor);
  });

  // International user locations, based on the centroids of country boundaries.
  // World Atlas country IDs: Ireland 372, Spain 724, South Korea 410.
  const userCountryIds = {'372':'Ireland', '724':'Spain', '410':'South Korea'};
  countries.forEach(country => {
    const name = userCountryIds[String(country.id)];
    if (!name) return;
    const [x, y] = path.centroid(country);
    if (Number.isFinite(x) && Number.isFinite(y)) {
      addMarker(name, x, y, 'user', userDotColor, true);
    }
  });

  document.getElementById('message').remove();
  updateMap();
}).catch(error => {
  document.getElementById('message').textContent = 'Unable to load map boundaries. Check your internet connection.';
  console.error('Map data loading error:', error);
});
</script>
</body>
</html>
